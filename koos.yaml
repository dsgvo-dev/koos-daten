# koos.yaml — Root-Konfiguration der KOOS-Instanz
#
# Dieses Dokument ist das Äquivalent zu configuration.nix in NixOS:
# Es beschreibt deklarativ, WAS diese Instanz ist, WELCHE Module aktiv sind
# und WELCHE Konventionen gelten.
#
# Der Resolver liest koos.yaml beim Start und leitet daraus den Systemzustand ab.
# Änderungen hier wirken sich auf die gesamte Instanz aus.
#
# Felder:
#   organisation.*   → Identität der Verwaltung (unveränderlich nach Inbetriebnahme)
#   module.*         → Pfade zu den vier Informationsdimensionen
#   id-praefixe.*    → Konvention für stabile IDs (NIEMALS nachträglich ändern)
#   vorschau.*       → Konfiguration der eingebetteten Vorschau
#   stand            → Datum der letzten Änderung an dieser Datei

# ---------------------------------------------------------------------------
# 1. ORGANISATION
#    Wer betreibt diese KOOS-Instanz?
# ---------------------------------------------------------------------------

organisation:
  id: gemeinde-musterstadt
  name: Gemeindeverwaltung Musterstadt
  kurzname: Musterstadt
  rechtsform: Gemeinde
  rechtsgrundlage: NKomVG §10
  gemeindeschluessel: "03000000"       # Amtlicher Gemeindeschlüssel (8-stellig)
  bundesland: Niedersachsen
  kreis: Musterkreis

  # Kontaktdaten der pflegenden Stelle
  ansprechpartner:
    name: Stabsstelle Organisation und Digitalisierung
    oe-id: oe-stabsstelle              # → orga.yaml
    email: organisation@musterstadt.de

# ---------------------------------------------------------------------------
# 2. MODULE
#    Wo leben die vier Informationsdimensionen?
#    Pfade relativ zu koos.yaml (= diesem Ordner).
# ---------------------------------------------------------------------------

module:
  oe:
    pfad: orga.yaml
    beschreibung: Organisationsstruktur — Einheiten, Rollen, Hierarchie
    status: aktiv

  prozesse:
    pfad: prozesse/
    muster: "proc-*.md"
    beschreibung: Verwaltungsprozesse mit Zuständigkeiten und Datenarten
    status: aktiv

  daten:
    pfad: daten/
    muster: "dstore-*.md"
    beschreibung: Datenarten mit Aufbewahrungsfristen und Rechtsgrundlagen
    status: aktiv

  regelungen:
    pfad: regelungen/
    muster: "reg-*.md"
    beschreibung: Dienstanweisungen, Richtlinien, Gesetze (in Vorbereitung)
    status: geplant

# ---------------------------------------------------------------------------
# 3. ID-PRÄFIXE
#    Stabile Präfix-Konvention für alle Entitäts-IDs.
#    NIEMALS nachträglich ändern — alle bestehenden IDs würden brechen.
# ---------------------------------------------------------------------------

id-praefixe:
  oe:        "oe-"       # Organisationseinheit, z. B. oe-fb1-personal
  prozess:   "proc-"     # Prozess,              z. B. proc-onboarding
  datenart:  "dstore-"    # Datenart,             z. B. dstore-personalakte
  regelung:  "reg-"      # Regelung,             z. B. reg-da-personal-001

# ID-Bildungsregel:
#   Dateiname (ohne .md) = ID der Entität
#   Beispiel: daten/dstore-personalakte.md → ID: dstore-personalakte
#
#   Neue IDs: präfix + kebab-case des Anzeigenamens (Umlaute ausschreiben)
#   ä → ae, ö → oe, ü → ue, ß → ss, Leerzeichen → -

# ---------------------------------------------------------------------------
# 4. VORSCHAU
#    Konfiguration der eingebetteten preview.html
# ---------------------------------------------------------------------------

vorschau:
  datei: index.html
  variante: eingebettet               # "eingebettet" = Daten im JS-Block der HTML-Datei
                                      # "extern"      = Daten via fetch() aus YAML/MD (folgt)
  resolver: laufzeit                  # Resolver baut ID→Name-Tabelle beim Seitenlade

  tabs:
    - id: oe
      bezeichnung: Organisationseinheiten
      status: aktiv
    - id: prozesse
      bezeichnung: Prozesse
      status: aktiv
    - id: daten
      bezeichnung: Datenarten
      status: aktiv
    - id: regelungen
      bezeichnung: Regelungen
      status: geplant

# ---------------------------------------------------------------------------
# 5. VARIANTE
#    Diese Instanz läuft im vereinfachten Modus.
#    Für den Übergang zur vollständigen Variante (BASIS) muss nur
#    der Resolver und das Vorschau-System ausgetauscht werden —
#    Dateistruktur und IDs bleiben identisch.
# ---------------------------------------------------------------------------

variante:
  modus: vereinfacht                  # "vereinfacht" | "vollstaendig"
  beschreibung: >
    Vereinfachter Betrieb ohne Schema-Validierung und Build-Skripte.
    Alle Dateien sind direkt im Texteditor pflegbar.
    Vorschau und YAML/MD müssen manuell synchron gehalten werden.

# ---------------------------------------------------------------------------
# 6. VERSIONIERUNG
#    Git übernimmt die Rolle des Nix Stores.
#    Generationen werden als Git-Tags markiert.
# ---------------------------------------------------------------------------

versionierung:
  system: git
  tag-schema: "v{JJJJ}-{Q}"          # Beispiel: v2026-Q1
  letzter-tag: ~                      # noch kein Tag gesetzt

# ---------------------------------------------------------------------------
# 7. VOKABULAR
#    Kontrollierte Wertelisten für strukturierte Felder in daten/*.md.
#    Jeder Wert außerhalb dieser Listen ist ein Pflegefehler.
#    Erweiterungen hier eintragen — nie direkt in den Inhaltsdateien erfinden.
#
#    FÜHRENDE QUELLE ist die Richtlinie zur Datenklassifizierung
#    (dsms-knowledge/facts/muster/dienstanweisungen/reg-klassifizierung-001.md,
#    Fassung 0.3 vom 2026-08-12). Weicht koos.yaml von ihr ab, gilt die
#    Richtlinie.
#
#    ─── DAS VIER-ACHSEN-MODELL ──────────────────────────────────────────────
#    Die Klassifizierung kennt vier Achsen. Sie unterscheiden sich nicht in
#    der Skala, sondern darin, WEM DER SCHADEN DROHT:
#
#      1  schutzstufe            A–E                die betroffene Person
#      2  vertraulichkeitsklasse V1–V4              der Geheimhaltungsbedarf
#                                                   der Verwaltungsinformation
#      3  bsi-*                  normal|hoch|
#                                sehr hoch          die verantwortliche Organisation
#      4  vs-einstufung          VS-NfD … STRENG    die Interessen des Bundes
#                                GEHEIM             oder eines Landes
#
#    KEINE ACHSE WIRD AUS EINER ANDEREN ABGELEITET. Jede ist eigenständig
#    festzulegen. Wer eine aus einer anderen errechnet, lässt sie verschwinden.
#
#    Der Schutzbedarf (normal|hoch) ist KEINE Achse, sondern das ERGEBNIS:
#    das Maximum aller vier Achsen. Er steuert das Verfahren — Baseline-TOMs
#    bei "normal", ergänzende Risikoanalyse und ggf. DSFA bei "hoch".
# ---------------------------------------------------------------------------

vokabular:

  # ═══ ACHSE 1 ═════════════════════════════════════════════════════════════
  # Schutzstufe — Schaden für die BETROFFENE PERSON
  # Quelle: Schutzstufenkonzept des LfD Niedersachsen, Stand Oktober 2018
  #   dsms-knowledge/facts/aufsichtsbehoerden/LfD-Niedersachsen/
  #     20181024_Schutzstufenkonzept.md
  #
  # Gilt NUR für personenbezogene Daten. Trägt eine Datenart keinen
  # Personenbezug (Feld personenbezug: nein), bleibt dieses Feld leer —
  # es ist dann nichts zu bemessen (Richtlinie, Anlage D, Frage 1).
  #
  # Zweifelsregel: im Zweifel die HÖHERE Stufe (Richtlinie Ziffer 4.3).
  # Eine Herabstufung bedarf der Begründung UND der Bestätigung durch die
  # zuständige Fachbereichsleitung.
  schutzstufe:
    A: Von der betroffenen Person frei zugänglich gemacht — Telefonverzeichnis, eigene Webseite, frei zugängliche soziale Medien
    B: Nicht frei zugänglich, unsachgemäße Handhabung lässt keine besondere Beeinträchtigung erwarten — Verteiler, Grundbucheinsicht
    C: Unsachgemäße Handhabung kann die gesellschaftliche Stellung oder die wirtschaftlichen Verhältnisse beeinträchtigen ("Ansehen") — Einkommen, Grundsteuer, Ordnungswidrigkeiten
    D: Unsachgemäße Handhabung kann erheblich beeinträchtigen ("Existenz") — Gesundheitsdaten, Art. 9 DSGVO, Sozialdaten, Schulden, Pfändungen, Straffälligkeit, dienstliche Beurteilungen
    E: Unsachgemäße Handhabung kann Gesundheit, Leben oder Freiheit beeinträchtigen — Opfer von Straftaten, Zeugenschutz

  # ═══ ACHSE 2 ═════════════════════════════════════════════════════════════
  # Vertraulichkeitsstufe — GEHEIMHALTUNGSBEDARF DER VERWALTUNGSINFORMATION
  # Quelle: ISO/IEC 27002:2022, Kapitel 5.12 (Richtlinie Abschnitt 3.2)
  #
  # Gilt für ALLE dienstlichen Informationen, auch ohne Personenbezug.
  # Beantwortet die Frage: WER DARF SIE KENNEN?
  #
  # ACHTUNG: Diese Achse ist EIGENSTÄNDIG und wird NICHT aus der Schutzstufe
  # errechnet. Bis zum 2026-08-12 war sie im Bestand eine mechanische
  # Ableitung (A->öffentlich, B->intern, C->vertraulich, D/E->streng
  # vertraulich) — bei allen 306 Datenarten ohne eine einzige Abweichung.
  # Damit war die Achse faktisch nicht vorhanden. Ein IT-Sicherheitskonzept
  # ohne Personenbezug ist V3, obwohl es keine Schutzstufe trägt.
  #
  # Die V-Kennungen entsprechen der Richtlinie Abschnitt 3.2; der Bestand
  # führt die Klartextwerte.
  vertraulichkeitsklasse:
    öffentlich:          "V1 — Zur Veröffentlichung freigegeben; kein Zugangsschutz erforderlich. Bekanntmachungen, freigegebene Pressemitteilungen, veröffentlichte Satzungen"
    intern:              "V2 — Nur für Beschäftigte der Verwaltung; nicht zur Weitergabe nach außen. Interner Schriftverkehr, Geschäftsverteilungsplan, Telefonlisten"
    vertraulich:         "V3 — Eingeschränkter Personenkreis, Need-to-Know. Vergabeunterlagen vor Zuschlag, IT-Sicherheitskonzepte, Verhandlungsstrategien"
    streng vertraulich:  "V4 — Zugang auf namentlich benannte Personen beschränkt. KRITIS-Notfallpläne, polizeiliche und ordnungsbehördliche Lagen"

  # ═══ ACHSE 3 ═════════════════════════════════════════════════════════════
  # BSI-Schutzbedarf — Schaden für die VERANTWORTLICHE ORGANISATION
  # Quelle: BSI-Standard 200-2, Kapitel 8.2.1
  #   dsms-knowledge/facts/BSI/BSI-Standard-200-2-IT-Grundschutz-Methodik.pdf
  #
  # Wird JE SCHUTZZIEL getrennt festgelegt — Vertraulichkeit, Integrität,
  # Verfügbarkeit (Felder bsi-vertraulichkeit, bsi-integritaet,
  # bsi-verfuegbarkeit). Das Feld bsi-schutzbedarf ist das Maximum der drei
  # und wird NICHT eigenständig gesetzt.
  #
  # Das BSI bestimmt die Kategorie über SECHS SCHADENSSZENARIEN:
  #   1  Verstoß gegen Gesetze, Vorschriften, Verträge
  #   2  Beeinträchtigung des informationellen Selbstbestimmungsrechts
  #   3  Beeinträchtigung der persönlichen Unversehrtheit
  #   4  Beeinträchtigung der Aufgabenerfüllung
  #   5  Negative Innen- oder Außenwirkung
  #   6  Finanzielle Auswirkungen
  #
  # FÜNF davon betreffen die Organisation, nur Szenario 2 die betroffene
  # Person. Dessen Wortlaut deckt sich mit dem LfD-Konzept:
  #   normal    = "beeinträchtigt werden kann"            -> Schutzstufe C
  #   hoch      = "erheblich beeinträchtigt werden kann"  -> Schutzstufe D
  #   sehr hoch = "Gefahr für Leib und Leben oder die
  #                persönliche Freiheit"                  -> Schutzstufe E
  # Das ist eine BEOBACHTUNG, KEINE ABLEITUNGSREGEL. Der BSI-Schutzbedarf
  # kann aus jedem der anderen fünf Szenarien höher ausfallen: Eine
  # Löschwasserkarte ohne Personenbezug hat hohe Verfügbarkeit, ein
  # Melderegister hohe Integrität.
  #
  # Verfügbarkeit ist über Szenario 4 quantifiziert (maximal tolerierbare
  # Ausfallzeit):  normal 24-72 h | hoch 1-24 h | sehr hoch unter 1 h
  bsi-schutzbedarf:
    normal:    Beeinträchtigungen sind begrenzt und überschaubar; maximal tolerierbare Ausfallzeit 24 bis 72 Stunden
    hoch:      Beeinträchtigungen können erheblich sein; maximal tolerierbare Ausfallzeit 1 bis 24 Stunden
    sehr hoch: Beeinträchtigungen können existenzbedrohend sein; maximal tolerierbare Ausfallzeit unter einer Stunde

  # ═══ ERGEBNIS (keine Achse) ══════════════════════════════════════════════
  # Schutzbedarf nach der Datenschutz-Vorgehensweise — Maximum aller Achsen.
  # Steuert das Verfahren. Bewusst ZWEIWERTIG; Begründung in der
  # Vorgehensweise, Grundüberlegung 2, und in der Richtlinie, Anlage C.
  # NICHT zu verwechseln mit bsi-schutzbedarf (dreiwertig).
  schutzbedarf:
    normal: Baseline-Maßnahmen genügen; keine vertiefte Risikoanalyse
    hoch:   Ergänzende Risikoanalyse erforderlich, ggf. DSFA nach Art. 35 DSGVO

  # ═══ VORFRAGE ════════════════════════════════════════════════════════════
  # Personenbezug — entscheidet, ob Achse 1 überhaupt anwendbar ist.
  # Richtlinie, Anlage D, Frage 1: "Sind personenbezogene Daten enthalten?
  # Nein -> nur Achse 2 anwenden."
  # Maßgeblich ist nach Art. 4 Nr. 1 DSGVO, WEM DER DATENSATZ ZUZUORDNEN
  # IST — nicht, ob ein Feld einen Namen trägt.
  # Fehlt das Feld, ist damit KEINE Aussage verbunden.
  personenbezug:
    ja:   Der Datensatz ist einer identifizierten oder identifizierbaren natürlichen Person zuzuordnen
    nein: Der Datensatz ist einer Organisationseinheit, einem Objekt oder einer Sache zuzuordnen — Achse 1 entfällt

  # ─────────────────────────────────────────────────────────────────────────
  # Verschlusssachen-Einstufung (dritte Klassifizierungsachse)
  #
  # Rechtsgrundlage: Verschlusssachenanweisung (VS-Anweisung/VSA) für das Land
  # Niedersachsen, RdErl. d. MI v. 13.2.1997 (Nds. MBl. S. 664), Stand Januar
  # 1999, VORIS 20480 00 00 03 004 — § 7. Für Landkreise und Gemeinden
  # eingeführt durch RdErl. d. MI v. 23.12.1982 (Nds. MBl. 1983 S. 265),
  # VORIS 20480 (VSAkomBRdErl).
  # Erfassung im DSMS:
  #   dsms-knowledge/facts/verwaltungsvorschriften/niedersachsen/
  #     vsa-verschlusssachenanweisung.md
  #
  # ACHTUNG — diese Achse folgt einer ANDEREN Zweifelsregel als die beiden
  # anderen. Schutzstufe und Schutzbedarf stufen im Zweifel HÖHER ein
  # (Maximalprinzip). Hier gilt § 1 Abs. 1 VSA: "Von einer Einstufung als VS
  # ist nur der notwendige Gebrauch zu machen." Anlage 1 Nr. 1 VSA verlangt,
  # dass die konkrete Gefährdung schlüssig darzulegen ist. Der Normalfall ist
  # KEINE Einstufung — das Feld bleibt dann leer (~).
  #
  # Abgrenzung: Anlage 1 Nr. 1 VSA verweist für personenbezogene Daten
  # ausdrücklich auf die Datenschutzgesetze, nicht auf die VSA. Eine hohe
  # Schutzstufe begründet also KEINE VS-Einstufung.
  #
  # Maßstab je Grad ist der Schaden für die Interessen der Bundesrepublik
  # Deutschland oder eines ihrer Länder — nicht für die betroffene Person
  # (Schutzstufe) und nicht für die eigene Organisation (BSI-Schutzbedarf).
  vs-einstufung:
    VS-NUR FÜR DEN DIENSTGEBRAUCH: Kenntnisnahme durch Unbefugte kann für die Interessen des Bundes oder eines Landes nachteilig sein (§ 7 Nr. 4 VSA)
    VS-VERTRAULICH:                Kenntnisnahme durch Unbefugte kann für die Interessen des Bundes oder eines Landes schädlich sein (§ 7 Nr. 3 VSA)
    GEHEIM:                        Kenntnisnahme durch Unbefugte kann die Sicherheit des Bundes oder eines Landes gefährden oder ihren Interessen schweren Schaden zufügen (§ 7 Nr. 2 VSA)
    STRENG GEHEIM:                 Kenntnisnahme durch Unbefugte kann den Bestand oder lebenswichtige Interessen des Bundes oder eines Landes gefährden (§ 7 Nr. 1 VSA)

  # Das Feld `datenkategorie` ist am 2026-08-15 ersatzlos entfallen (ADR 013).
  # Es hatte keinen Abnehmer ausserhalb von Anzeige, Suche und Filter; die
  # Kategorien personenbezogener Daten nach Art. 30 Abs. 1 lit. c DSGVO stehen
  # im Feld `kategorien_daten` der VVT. Thematische Facette ist seither
  # `zuständige-einheit`. Die 302 Altwerte liegen in
  # dsms-knowledge/_archive/datenkategorie-werte-vor-entfernung-2026-08-15.csv

  # Generische Rollen (implizit in jeder OE vorhanden; kein Eintrag in orga.yaml nötig)
  # Verwendung: Prozesse und Regelungen referenzieren diese Rollen, wenn keine
  # OE-spezifische Rolle passt.
  generische-rollen:
    - Leitung          # Formal verantwortliche Person der OE; Entscheidungs- und Zeichnungsbefugnis
    - Sachbearbeitung  # Operativ tätig; führt Verwaltungsverfahren durch
    - Mitarbeitende    # Alle übrigen Personen der OE ohne benannte Funktion

# ---------------------------------------------------------------------------
# METADATEN
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 8. BEARBEITUNG
#    Konfiguration des eingebetteten Edit-Modus in preview.html.
#    Das formular-schema steuert, welche Felder in den Eingabemasken
#    erscheinen. Felder hier hinzufügen oder entfernen → preview.html
#    übernimmt die Änderungen automatisch beim nächsten Laden.
#
#    Superadmin-Aufgaben:
#      - Passwort-Hash ändern (SHA-256 des gewünschten Passworts)
#      - Felder ergänzen oder entfernen
#      - Neue Feldtypen: text | textarea | select | oe-select | list-text |
#                        list-oe-aufgabe | multi-daten
# ---------------------------------------------------------------------------

bearbeitung:
  # SHA-256-Hash erzeugen (Browser-Konsole):
  #   crypto.subtle.digest('SHA-256', new TextEncoder().encode('PASSWORT'))
  #     .then(b => console.log(Array.from(new Uint8Array(b))
  #       .map(x=>x.toString(16).padStart(2,'0')).join('')))

  # ── Superadmin ─────────────────────────────────────────────────────────────
  # Vollzugriff: alle OE, Schemapflege, Subadmin-Verwaltung
  superadmin:
    passwort-hash: e34f4b940d9e21f0ef7e0ac647704ad01d964c00b0148fbeb19995be6d80e123
    # Standardpasswort: koos2026 — vor Produktiveinsatz ändern!

  # ── Subadmins ──────────────────────────────────────────────────────────────
  # Dezentrale Bearbeiter: dürfen Prozesse und Datenarten anlegen/bearbeiten,
  # aber nur in den OE, die unter zustaendig-fuer aufgeführt sind.
  # OE-Struktur (orga.yaml) und Schema können nur Superadmins ändern.
  #
  # Nach Änderungen hier: den Block "subadmins" in preview.html › CONFIG
  # entsprechend aktualisieren (gleiche Struktur, Hash bleibt identisch).
  subadmins:
    - id: sub-fb1
      name: Fachbereich 1 – Personal & IT
      passwort-hash: 2e09c6dc151c08685424617d46848a44a6ee5f053a0d18f8defd0616501151e5
      # Passwort: fb1-2026 — vor Produktiveinsatz ändern!
      zustaendig-fuer:
        - oe-fb1-personal
        - oe-fb1-it
        - oe-fb1-buerger
        - oe-fb1               # Fachbereichsebene einschließen

    - id: sub-hvb
      name: Hauptverwaltungsbereich
      passwort-hash: a1d25b71e601b052c656eb488ec650d5b78723e0bbf1515771bf2e1b8baf7a1c
      # Passwort: hvb-2026 — vor Produktiveinsatz ändern!
      zustaendig-fuer:
        - oe-hvb
        - oe-stabsstelle
        - oe-personalrat

  formular-schema:

    prozess:
      id-praefix: proc-
      datei-pfad: prozesse/
      felder:
        - {id: titel,              label: Titel,                    typ: text,            pflicht: true}
        - {id: status,             label: Status,                   typ: select,          vokabular: prozessStatus, pflicht: true}
        - {id: zustaendigeEinheit, label: "Zuständige OE",          typ: oe-select,       pflicht: true}
        - {id: zustaendigeRolle,   label: "Zuständige Rolle",       typ: text}
        - {id: beteiligte,         label: Beteiligte Einheiten,     typ: list-oe-aufgabe}
        - {id: datenarten,         label: Verarbeitete Datenarten,  typ: multi-daten}
        - {id: regelungen,         label: Rechtsgrundlagen,         typ: list-text}

    daten:
      id-praefix: dstore-
      datei-pfad: daten/
      # Struktur der Datei: Markdown mit YAML-Frontmatter.
      # Die Klassifizierungsfelder liegen im Bestand unter dem Block
      # "klassifizierung:"; das ist unter feldpfad je Feld vermerkt.
      # HINWEIS: preview.html kennt diese Feldliste noch nicht vollstaendig.
      felder:
        # ── Identitaet ───────────────────────────────────────────────────────
        - {id: name,               label: Bezeichnung,              typ: text,      pflicht: true}
        # datenkategorie am 2026-08-15 entfallen (ADR 013)
        - {id: zustaendigeEinheit, label: "Zuständige OE",          typ: oe-select, feldpfad: "zuständige-einheit", pflicht: true}

        # ── Vorfrage: entscheidet ueber die Anwendbarkeit von Achse 1 ────────
        # Richtlinie, Anlage D, Frage 1. Fehlt das Feld, ist damit KEINE
        # Aussage verbunden — der Bestand ist darauf nicht durchgesehen.
        - {id: personenbezug,      label: Personenbezug,            typ: select,    vokabular: personenbezug}

        # ── ACHSE 1 — Schaden fuer die betroffene Person ─────────────────────
        # Nur bei personenbezug: ja. Sonst leer lassen.
        - {id: schutzstufe,        label: "Schutzstufe (Achse 1, LfD A–E)",  typ: select, vokabular: schutzstufe, feldpfad: "klassifizierung.schutzstufe"}

        # ── ACHSE 2 — Geheimhaltungsbedarf der Verwaltungsinformation ────────
        # EIGENSTAENDIG festzulegen, NICHT aus Achse 1 ableiten.
        # Gilt auch fuer Datenarten ohne Personenbezug.
        - {id: vertraulichkeitsklasse, label: "Vertraulichkeitsstufe (Achse 2, V1–V4)", typ: select, vokabular: vertraulichkeitsklasse, feldpfad: "klassifizierung.vertraulichkeitsklasse"}

        # ── ACHSE 3 — Schaden fuer die verantwortliche Organisation ──────────
        # Je Schutzziel getrennt festzulegen (BSI 200-2, sechs Schadens-
        # szenarien). bsi-schutzbedarf ist das MAXIMUM der drei und wird
        # nicht eigenstaendig gesetzt.
        - {id: bsiVertraulichkeit, label: "BSI-Vertraulichkeit (Achse 3)", typ: select, vokabular: bsi-schutzbedarf, feldpfad: "klassifizierung.bsi-vertraulichkeit"}
        - {id: bsiIntegritaet,     label: "BSI-Integrität (Achse 3)",     typ: select, vokabular: bsi-schutzbedarf, feldpfad: "klassifizierung.bsi-integritaet"}
        - {id: bsiVerfuegbarkeit,  label: "BSI-Verfügbarkeit (Achse 3)",  typ: select, vokabular: bsi-schutzbedarf, feldpfad: "klassifizierung.bsi-verfuegbarkeit"}
        - {id: bsiSchutzbedarf,    label: "BSI-Schutzbedarf (Maximum, abgeleitet)", typ: select, vokabular: bsi-schutzbedarf, feldpfad: "klassifizierung.bsi-schutzbedarf", abgeleitet: true}

        # ── ACHSE 4 — Schaden fuer die Interessen des Bundes oder Landes ─────
        # VSA Niedersachsen, § 7. Angelegt 2026-08-12, im Bestand LEER.
        # § 1 Abs. 1 VSA: nur der notwendige Gebrauch. Der Normalfall ist
        # KEINE Einstufung. Anlage 1 Nr. 1 VSA: eine hohe Schutzstufe
        # begruendet KEINE VS-Einstufung.
        - {id: vsEinstufung,       label: "VS-Einstufung (Achse 4)", typ: select,   vokabular: vs-einstufung}
        - {id: vsHerausgebendeStelle, label: "Herausgebende Stelle (VS)", typ: oe-select}
        - {id: vsEinstufungDatum,  label: "Datum der VS-Einstufung", typ: text}
        - {id: vsFristEnde,        label: "Ende der VS-Einstufung",  typ: text}
        - {id: vsFristverlaengerungBegruendung, label: "Begründung der Fristverlängerung (VS)", typ: textarea}
        - {id: vsTeileinstufung,   label: "Abweichend eingestufte Teile (VS)", typ: textarea}

        # ── ERGEBNIS — Maximum aller vier Achsen, steuert das Verfahren ──────
        - {id: schutzbedarf,       label: "Schutzbedarf (Ergebnis, normal|hoch)", typ: select, vokabular: schutzbedarf, feldpfad: "klassifizierung.schutzbedarf"}

        # ── Kontextmodell (ADR 010) ─────────────────────────────────────────
        # Kontextabhaengige Aufspaltung von Allgemeinplaetzen. Nur bei
        # Basisspeichern und ihren -vertraulich-Varianten gesetzt.
        - {id: kontext,            label: "Kontext (Basis/Variante)", typ: textarea, feldpfad: "kontext"}

        # ── Rechtsgrundlagen und Aufbewahrung ───────────────────────────────
        - {id: rechtsgrundlagen,   label: Rechtsgrundlagen,         typ: list-text, feldpfad: "klassifizierung.rechtsgrundlagen"}
        - {id: aufbewahrungFrist,  label: Aufbewahrungsfrist,       typ: text,      feldpfad: "klassifizierung.aufbewahrung.frist"}
        - {id: aufbewahrungBeginn, label: Fristbeginn,              typ: text,      feldpfad: "klassifizierung.aufbewahrung.beginn"}

